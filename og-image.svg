<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b4513"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#daa520"/>
      <stop offset="100%" stop-color="#a0522d"/>
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Geometric pattern -->
  <circle cx="1291" cy="35" r="75" fill="#a0522d" opacity="0.10"/>
    <circle cx="124" cy="65" r="97" fill="#a0522d" opacity="0.07"/>
    <circle cx="940" cy="526" r="30" fill="#a0522d" opacity="0.12"/>
    <circle cx="-28" cy="636" r="52" fill="#a0522d" opacity="0.15"/>
    <circle cx="325" cy="210" r="32" fill="#a0522d" opacity="0.16"/>
    <circle cx="-34" cy="-41" r="27" fill="#a0522d" opacity="0.12"/>
    <rect x="996" y="84" width="34" height="45" rx="8" fill="#8b4513" opacity="0.03" transform="rotate(25, 1012, -39)"/>
    <rect x="-82" y="628" width="79" height="35" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(30, 1206, 316)"/>
    <rect x="184" y="26" width="31" height="61" rx="8" fill="#8b4513" opacity="0.07" transform="rotate(8, 487, 235)"/>
    <rect x="113" y="623" width="77" height="63" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(13, -93, 603)"/>
    <rect x="1206" y="77" width="47" height="26" rx="8" fill="#8b4513" opacity="0.06" transform="rotate(23, 30, 716)"/>
    <rect x="722" y="606" width="38" height="31" rx="8" fill="#8b4513" opacity="0.09" transform="rotate(15, 247, 344)"/>
    <rect x="1240" y="233" width="64" height="72" rx="8" fill="#8b4513" opacity="0.12" transform="rotate(41, 256, -3)"/>
    <rect x="242" y="273" width="27" height="88" rx="8" fill="#8b4513" opacity="0.04" transform="rotate(11, 945, 109)"/>
    <polygon points="1037,-70 1131,118 943,118" fill="#a0522d" opacity="0.06"/>
    <polygon points="839,653 899,773 779,773" fill="#a0522d" opacity="0.13"/>
    <polygon points="975,628 1022,722 928,722" fill="#a0522d" opacity="0.06"/>
    <polygon points="410,450 504,638 316,638" fill="#a0522d" opacity="0.10"/>

  <!-- Wave at bottom -->
  <path d="M0,582 C360,606 840,558 1200,582 L1200,630 L0,630Z" fill="#a0522d" opacity="0.3"/>

  <!-- 중앙 텍스트 카드 -->
  <rect x="80" y="195" width="1040" height="260" rx="20" fill="rgba(0,0,0,0.35)" filter="url(#blur-bg)"/>
  <filter id="blur-bg"><feGaussianBlur stdDeviation="8"/></filter>

  <text x="600" y="270" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="44" font-weight="700" fill="#ffffff" letter-spacing="2">
    강남 셔츠룸
  </text>
  <text x="600" y="330" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="22" font-weight="400" fill="rgba(255,255,255,0.85)">
    마포 — 서버 웜업
  </text>

  <!-- Accent line -->
  <line x1="450" y1="355" x2="750" y2="355" stroke="#daa520" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- 하단 CTA -->
  <rect x="440" y="385" width="320" height="40" rx="20" fill="#daa520" opacity="0.9"/>
  <text x="600" y="411" text-anchor="middle" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="16" font-weight="600" fill="#ffffff">
    ▼ 자세히 보기
  </text>

  <!-- 상단 브랜드 -->
  <text x="60" y="55" font-family="'Noto Sans JP','Noto Sans KR','Pretendard',sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.6)">
    마포 강남 셔츠룸 — 서버 웜업
  </text>
</svg>